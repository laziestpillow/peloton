name: API CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: peloton
          POSTGRES_USER: peloton
          POSTGRES_PASSWORD: peloton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peloton -d peloton"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @peloton/api lint
      - run: pnpm --filter @peloton/api test
      - run: pnpm --filter @peloton/api build
      - run: pnpm --filter @peloton/api contract:check
      - run: pnpm --filter @peloton/api db:migrate
        env:
          DATABASE_URL: postgres://peloton:peloton@127.0.0.1:5432/peloton
