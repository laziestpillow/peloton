services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peloton
      POSTGRES_USER: peloton
      POSTGRES_PASSWORD: peloton
    ports:
      - "5432:5432"
    volumes:
      - peloton-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peloton -d peloton"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peloton-postgres:

